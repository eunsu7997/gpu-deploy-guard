apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container-gpu-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-example
  template:
    metadata:
      labels:
        app: resource-example
    spec:
      containers:
      - name: container-a
        image: example.invalid/llm-workload:placeholder
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: 1
        startupProbe:
          httpGet:
            path: /health
            port: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - test -f /tmp/healthy
      - name: container-b
        image: example.invalid/llm-workload:placeholder
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: 1
        startupProbe:
          httpGet:
            path: /health
            port: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - test -f /tmp/healthy
